<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Panorama Viewer</title>
    <!-- Pannellum CSS -->
    <link rel="stylesheet" href="lib/Pannellum2_5_6/pannellum.css"/>
    <!-- Pannellum JS -->
    <script type="text/javascript" src="lib/Pannellum2_5_6/pannellum.js"></script>
    <script type="text/javascript" src="lib/Pannellum2_5_6/libpannellum.js"></script>
    <style>
        /* Добавляем стили для полноэкранного отображения */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
<div id="canvas"></div>
<!-- Добавить перед закрывающим тегом </body> -->
<div id="hotspotModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Настройка HotSpot</h2>

        <div class="form-group">
            <label for="hotspotName">Название точки:</label>
            <input type="text" id="hotspotName" placeholder="Введите название (необязательно)">
        </div>

        <div class="form-group">
            <label for="hotspotUrl">URL панорамы для перехода:</label>
            <div class="url-input-group">
                <input type="text" id="hotspotUrl" placeholder="Введите URL панорамы">
                <button id="previewButton" class="btn">Предпросмотр</button>
            </div>
        </div>

        <div id="previewContainer" class="preview-container" style="display: none;">
            <h3>Предпросмотр панорамы</h3>
            <p>Нажмите на место, куда должен смотреть камера при переходе</p>
            <div id="previewIframeContainer" class="iframe-container">
                <!-- Здесь будет iframe с viewer.html -->
            </div>
            <div class="preview-coordinates">
                <p>Выбранные координаты:</p>
                <div id="selectedCoordinates">Не выбрано</div>
            </div>
        </div>

        <div class="form-group">
            <label for="hotspotType">Тип точки:</label>
            <select id="hotspotType">
                <option value="scene">Переход на сцену</option>
                <option value="info">Информационная</option>
                <option value="custom">Пользовательская</option>
            </select>
        </div>

        <div class="form-group">
            <label for="hotspotText">Текст на точке:</label>
            <input type="text" id="hotspotText" placeholder="Текст, который будет отображаться">
        </div>

        <div class="modal-actions">
            <button id="saveHotspotButton" class="btn btn-primary">Сохранить точку</button>
            <button id="exportJsonButton" class="btn btn-secondary">Экспорт в JSON</button>
            <button id="cancelButton" class="btn">Отмена</button>
        </div>

        <div id="currentHotspotsList" class="hotspots-list">
            <h3>Текущие точки:</h3>
            <div id="hotspotsContainer"></div>
        </div>
    </div>
</div>
<style>
    /* Стили для модального окна */
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 10000;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        width: 80%;
        max-width: 900px;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
    }

    .close {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 24px;
        cursor: pointer;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }

    .url-input-group {
        display: flex;
        gap: 10px;
    }

    .url-input-group input {
        flex: 1;
    }

    .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .btn-primary {
        background-color: #4CAF50;
        color: white;
    }

    .btn-secondary {
        background-color: #2196F3;
        color: white;
    }

    .preview-container {
        margin: 20px 0;
        border: 1px solid #ddd;
        padding: 15px;
        border-radius: 4px;
    }

    .iframe-container {
        width: 100%;
        height: 300px;
        border: 1px solid #ccc;
        margin: 10px 0;
    }

    .iframe-container iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    .preview-coordinates {
        background-color: #f5f5f5;
        padding: 10px;
        border-radius: 4px;
        margin-top: 10px;
    }

    .modal-actions {
        display: flex;
        gap: 10px;
        margin: 20px 0;
    }

    .hotspots-list {
        margin-top: 20px;
        border-top: 1px solid #eee;
        padding-top: 20px;
    }

    .hotspot-item {
        padding: 10px;
        border: 1px solid #ddd;
        margin-bottom: 5px;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .hotspot-actions {
        display: flex;
        gap: 5px;
    }
</style>
<script>
    var sceneMain = null;
    var currentScene = null;

    // Заменяем $(document).ready() на DOMContentLoaded
    document.addEventListener('DOMContentLoaded', function() {
        loadInitialScene();
    });

    function loadInitialScene() {
        setSelectPanorama();
    }

    function setSelectPanorama(hotSpot) {
        let params = new URLSearchParams(document.location.search);
        let infoValue = params.get('info');
        let photoValue = params.get('photo');
        let hotSpots = params.get('hotSpots');
        let canvas = document.getElementById('canvas');
        canvas.style.width = '100%';
        canvas.style.height = '100%';

        if (photoValue) {
            var imageUrl = photoValue;
            var isExternal = /^https?:\/\//i.test(photoValue);
            if (isExternal) {
                var tempIframe = document.createElement('iframe');
                tempIframe.style.display = 'none';
                tempIframe.style.width = '0';
                tempIframe.style.height = '0';
                tempIframe.style.border = '0';
                tempIframe.style.position = 'absolute';
                tempIframe.style.top = '-1000px';
                tempIframe.style.left = '-1000px';
                // Добавляем iframe в DOM, но НЕ устанавливаем src сразу
                document.body.appendChild(tempIframe);
                // Устанавливаем src через небольшой таймаут
                setTimeout(function() {
                    tempIframe.src = photoValue;
                    // Удаляем iframe через 10 секунд чтобы не засорять DOM
                    setTimeout(function() {
                        if (tempIframe && tempIframe.parentNode) {
                            tempIframe.parentNode.removeChild(tempIframe);
                        }
                    }, 10000);
                }, 100);
                imageUrl = photoValue;
            }
            let jsonObj = {
                "hotSpotDebug": false,
                "hotPointDebug": true,
                "sceneFadeDuration": 1000,
                "default": {
                    "firstScene": "scene1"
                },
                "scenes": {
                    "scene1": {
                        //"title": isExternal ? "External Image" : "Image: " + photoValue,
                        "title": "",
                        "panorama": imageUrl,
                        "crossOrigin": isExternal ? undefined : "use-credentials",
                        "autoLoad": true,
                        "yaw": 0,
                        "pitch": 0,
                        "hotSpots": hotSpots ? hotSpots : []
                    }
                }
            };
            // Дополнительные настройки для внешних изображений
            if (isExternal) {
                // Убеждаемся, что URL начинается с https://
                var secureUrl = photoValue;
                if (secureUrl.startsWith('http://')) {
                    secureUrl = secureUrl.replace('http://', 'https://');
                }

                // Создаем временный iframe для предзагрузки изображения
                var tempIframe = document.createElement('iframe');
                tempIframe.style.display = 'none';
                tempIframe.style.width = '0';
                tempIframe.style.height = '0';
                tempIframe.style.border = '0';
                tempIframe.style.position = 'absolute';
                tempIframe.style.top = '-1000px';
                tempIframe.style.left = '-1000px';

                // Устанавливаем атрибут sandbox для безопасности
                tempIframe.sandbox = 'allow-same-origin allow-scripts';

                // Добавляем iframe в DOM
                document.body.appendChild(tempIframe);

                // Загружаем через HTTPS с небольшим таймаутом
                setTimeout(function() {
                    tempIframe.src = secureUrl;
                    console.log('Preloading external image via iframe:', secureUrl);
                    // Удаляем iframe через 10 секунд чтобы не засорять DOM
                    setTimeout(function() {
                        if (tempIframe && tempIframe.parentNode) {
                            tempIframe.parentNode.removeChild(tempIframe);
                            console.log('Cleanup: iframe removed');
                        }
                    }, 10000);
                }, 100);
                imageUrl = photoValue; // Оставляем оригинальный URL для Pannellum
            }
            jsonObj.onClickHotSpot = onClickHotSpot;
            jsonObj.onDblClick = onDblClick;
            jsonObj.onClick = onClick;
            jsonObj.onContextMenuHotSpot = onContextMenuHotSpot;
            jsonObj.onContextMenu = onContextMenu;
            if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                sceneMain.destroy();
            }
            sceneMain = pannellum.viewer('canvas', jsonObj);
            currentScene = photoValue;
        }
        // Если есть параметр info, загружаем через JSON конфигурацию
        else if (infoValue) {
            let jsonObj = getJsonUrlData('/Example/pano360/point_info/' + infoValue);
            jsonObj.onClickHotSpot = onClickHotSpot;
            jsonObj.onDblClick = onDblClick;
            jsonObj.onClick = onClick;
            jsonObj.onContextMenuHotSpot = onContextMenuHotSpot;
            jsonObj.onContextMenu = onContextMenu;

            if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                sceneMain.destroy();
            }
            sceneMain = pannellum.viewer('canvas', jsonObj);
            currentScene = infoValue;
        }
        // Если нет параметров, загружаем изображение по умолчанию
        else {
            // Веб-путь для изображения по умолчанию
            var defaultImage = 'img/04.01.2026/DSCN0021.JPG';

            let jsonObj = {
                "hotSpotDebug": false,
                "hotPointDebug": true,
                "sceneFadeDuration": 1000,
                "default": {
                    "firstScene": "scene1"
                },
                "scenes": {
                    "scene1": {
                        "title": "Default Panorama",
                        "panorama": defaultImage,
                        "crossOrigin": "use-credentials",
                        "autoLoad": true,
                        "yaw": -6.77,
                        "pitch": -24.41,
                        "hotSpots": []
                    }
                }
            };
            jsonObj.onClickHotSpot = onClickHotSpot;
            jsonObj.onDblClick = onDblClick;
            jsonObj.onClick = onClick;
            jsonObj.onContextMenuHotSpot = onContextMenuHotSpot;
            jsonObj.onContextMenu = onContextMenu;

            if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                sceneMain.destroy();
            }
            sceneMain = pannellum.viewer('canvas', jsonObj);
            currentScene = 'default';
        }
    }

    function onDblClick(coords, screenCoords, event) {
        console.log("Double click on scene:", {
            coords: coords,
            screenCoords: screenCoords,
            event: event
        });

        // Открываем модальное окно для создания HotSpot
        openHotSpotModal(coords);
    }

    function onClick(hs) {
        console.log("onClick", arguments[0]);
    }

    function onClickHotSpot(hs) {
        console.log("onClick", arguments[0]);
        const jsonName = hs['panorama_url']?.split('/')[4];
        if (jsonName) {
            const name = jsonName.split('.')[0];
            let currentUrl = new URL(window.location.href);
            if (!currentUrl.searchParams.get('info')) {
                currentUrl.searchParams.append('info', hs.panorama_url.split('/')[4]);
            } else {
                currentUrl.searchParams.set('info', hs.panorama_url.split('/')[4]);
            }
            window.history.pushState({}, '', currentUrl);
            let jsonObj = getJsonUrlData(hs['panorama_url']);
            jsonObj.onClickHotSpot = onClickHotSpot;
            jsonObj.onDblClick = onDblClick;
            jsonObj.onClick = onClick;
            jsonObj.onContextMenuHotSpot = onContextMenuHotSpot;
            jsonObj.onContextMenu = onContextMenu;

            jsonObj['pitch'] = hs['point_pitch'];
            jsonObj['yaw'] = hs['point_yaw'];
            if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                sceneMain.destroy();
            }
            sceneMain = pannellum.viewer('canvas', jsonObj);
            currentScene = name;
            return true;
        }
        return false;
    }

    // Вспомогательные функции
    function getJsonUrlData(url, data) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', url, false);
        xhr.send(data);
        if (xhr.status != 200) {
            console.error(xhr.status + ': ' + xhr.statusText + ' (' + url + ')');
            return {'error': xhr.status + ' : ' + xhr.statusText};
        } else {
            return JSON.parse(xhr.response);
        }
    }


    // Функция для обработки правой кнопки мыши на HotSpot
    function onContextMenuHotSpot(coords, screenCoords, event, hotSpot) {
        debugger

        console.log("Right click on HotSpot:", {
            coords: coords,
            screenCoords: screenCoords,
            hotSpot: hotSpot,
            event: event
        });

        // Пример: показать информацию о HotSpot
        alert(`HotSpot context menu:\n` +
            `Yaw: ${coords.yaw.toFixed(2)}°\n` +
            `Pitch: ${coords.pitch.toFixed(2)}°\n` +
            `Screen: (${screenCoords.x}, ${screenCoords.y})\n` +
            `HotSpot text: ${hotSpot.text || 'No text'}`);

        // Здесь можно добавить свое контекстное меню
        // Например, создать и показать кастомное меню
        showCustomContextMenu(screenCoords.x, screenCoords.y, {
            type: 'hotspot',
            data: hotSpot,
            coords: coords
        });
    }

    // Функция для обработки правой кнопки мыши на сцене
    function onContextMenu(coords, screenCoords, event) {
        console.log("Right click on scene:", {
            coords: coords,
            screenCoords: screenCoords,
            event: event
        });
        // Пример: показать информацию о точке
        // alert(`Scene context menu:\n` +
        //     `Yaw: ${coords.yaw.toFixed(2)}°\n` +
        //     `Pitch: ${coords.pitch.toFixed(2)}°\n` +
        //     `Screen: (${screenCoords.x}, ${screenCoords.y})`);
        // Здесь можно добавить свое контекстное меню
        // Например, создать и показать кастомное меню
        showCustomContextMenu(screenCoords.x, screenCoords.y, {
            type: 'scene',
            data: coords,
            screenCoords: screenCoords
        });
    }

    // Вспомогательная функция для показа кастомного контекстного меню
    function showCustomContextMenu(x, y, data) {
        debugger
        // Удаляем старое меню, если есть
        var oldMenu = document.getElementById('custom-context-menu');
        if (oldMenu) {
            oldMenu.remove();
        }

        // Создаем новое меню
        var menu = document.createElement('div');
        menu.id = 'custom-context-menu';
        menu.style.position = 'absolute';
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        menu.style.background = 'white';
        menu.style.border = '1px solid #ccc';
        menu.style.boxShadow = '2px 2px 5px rgba(0,0,0,0.2)';
        menu.style.zIndex = '10000';
        menu.style.padding = '5px 0';
        menu.style.minWidth = '150px';

        // Добавляем пункты меню в зависимости от типа
        if (data.type === 'hotspot') {
            menu.innerHTML = `
            <div class="menu-item" onclick="handleHotSpotAction('edit', ${JSON.stringify(data.data).replace(/"/g, '&quot;')})" style="padding: 5px 10px; cursor: pointer;">Edit HotSpot</div>
            <div class="menu-item" onclick="handleHotSpotAction('delete', ${JSON.stringify(data.data).replace(/"/g, '&quot;')})" style="padding: 5px 10px; cursor: pointer;">Delete HotSpot</div>
            <hr style="margin: 5px 0;">
            <div class="menu-item" onclick="copyCoords(${JSON.stringify(data.coords)})" style="padding: 5px 10px; cursor: pointer;">Copy Coordinates</div>
        `;
        } else {
            menu.innerHTML = `
            <div class="menu-item" onclick='addHotSpotAt(${JSON.stringify(data.data)})' style="padding: 5px 10px; cursor: pointer;">Add HotSpot Here</div>
            <div class="menu-item" onclick='copyCoords(${JSON.stringify(data.data)})' style="padding: 5px 10px; cursor: pointer;">Copy Coordinates</div>
            <hr style="margin: 5px 0;">
            <div class="menu-item" onclick='centerView(${JSON.stringify(data.data)})' style="padding: 5px 10px; cursor: pointer;">Center View Here</div>
        `;
        }

        document.body.appendChild(menu);

        // Закрываем меню при клике вне его
        setTimeout(function() {
            document.addEventListener('click', function closeMenu(e) {
                if (!menu.contains(e.target)) {
                    menu.remove();
                    document.removeEventListener('click', closeMenu);
                }
            });
        }, 0);
    }

    // Пример обработчиков действий меню
    function handleHotSpotAction(action, hotSpot) {
        console.log(action + ' HotSpot:', hotSpot);
        alert(action + ' HotSpot: ' + (hotSpot.text || hotSpot.type));
    }

    function copyCoords(coords) {
        var text = `Yaw: ${coords.yaw.toFixed(2)}, Pitch: ${coords.pitch.toFixed(2)}`;
        navigator.clipboard.writeText(text).then(function() {
            console.log('Coordinates copied to clipboard:', text);
            alert('Coordinates copied: ' + text);
        });
    }

    function addHotSpotAt(coords) {
        console.log('Add HotSpot at:', coords);
        // Здесь можно добавить логику создания нового HotSpot
        alert('Add HotSpot at: Yaw=' + coords.yaw.toFixed(2) + ', Pitch=' + coords.pitch.toFixed(2));
    }

    function centerView(coords) {
        if (sceneMain) {
            sceneMain.lookAt(coords.pitch, coords.yaw, sceneMain.getHfov(), 500);
        }
    }
    // Переменные для управления состоянием
    var currentHotspots = [];
    var currentCoords = null;
    var selectedPreviewCoords = null;
    var previewIframe = null;

    // Функция открытия модального окна
    function openHotSpotModal(coords) {
        currentCoords = coords;
        selectedPreviewCoords = null;

        // Показать модальное окно
        var modal = document.getElementById('hotspotModal');
        modal.style.display = 'flex';

        // Очистить поля
        document.getElementById('hotspotName').value = '';
        document.getElementById('hotspotUrl').value = '';
        document.getElementById('hotspotType').value = 'scene';
        document.getElementById('hotspotText').value = '';
        document.getElementById('selectedCoordinates').textContent = 'Не выбрано';
        document.getElementById('previewContainer').style.display = 'none';

        // Загрузить список существующих точек
        loadHotspotsList();
    }

    // Функция закрытия модального окна
    function closeModal() {
        var modal = document.getElementById('hotspotModal');
        modal.style.display = 'none';

        // Уничтожить iframe если он существует
        if (previewIframe) {
            previewIframe.remove();
            previewIframe = null;
        }
    }

    // Функция загрузки предпросмотра
    // В edit.html в функции loadPreview() замените создание iframe на:
    function loadPreview() {
        var url = document.getElementById('hotspotUrl').value;
        if (!url) {
            alert('Введите URL панорамы');
            return;
        }

        // Показать контейнер предпросмотра
        document.getElementById('previewContainer').style.display = 'block';

        // Создать iframe с viewer_preview.html
        var iframeContainer = document.getElementById('previewIframeContainer');
        iframeContainer.innerHTML = '';

        previewIframe = document.createElement('iframe');
        previewIframe.src = 'viewer_preview.html?photo=' + encodeURIComponent(url);

        iframeContainer.appendChild(previewIframe);

        // Добавить обработчик сообщений от iframe
        window.addEventListener('message', handlePreviewMessage);
    }


    function handlePreviewMessage(event) {
        var iframe = document.querySelector('#previewIframeContainer iframe');
        if (!iframe || event.source !== iframe.contentWindow) return;

        if (event.data && event.data.type === 'hotspot_preview_coords') {
            selectedPreviewCoords = {
                click: event.data.clickCoords,
                view: event.data.viewCoords
            };

            var coordsText = `
            <strong>Координаты клика:</strong><br>
            Yaw: ${selectedPreviewCoords.click.yaw.toFixed(2)}°,
            Pitch: ${selectedPreviewCoords.click.pitch.toFixed(2)}°<br><br>
            <strong>Направление камеры:</strong><br>
            Yaw: ${selectedPreviewCoords.view.yaw.toFixed(2)}°,
            Pitch: ${selectedPreviewCoords.view.pitch.toFixed(2)}°
        `;

            document.getElementById('selectedCoordinates').innerHTML = coordsText;
        }
    }

    // Функция сохранения HotSpot
    // В edit.html заменяем функцию saveHotspot
    function saveHotspot() {
        var name = document.getElementById('hotspotName').value;
        var url = document.getElementById('hotspotUrl').value;
        var type = document.getElementById('hotspotType').value;
        var text = document.getElementById('hotspotText').value;

        // Проверка обязательных полей
        if (!url) {
            alert('URL панорамы обязателен для заполнения');
            return;
        }

        // Создаем объект HotSpot в требуемом формате
        var hotspot = {
            id: Date.now(), // Уникальный ID
            name: name || 'Без имени',
            type: type,
            text: text || 'Точка перехода',
            pitch: currentCoords.pitch,
            yaw: currentCoords.yaw,
            targetPitch: selectedPreviewCoords ? selectedPreviewCoords.view.pitch : 0,
            targetYaw: selectedPreviewCoords ? selectedPreviewCoords.view.yaw : 0,
            panorama_url: url,
            createdAt: new Date().toISOString()
        };

        // Добавляем в массив точек
        currentHotspots.push(hotspot);

        // Обновляем список точек
        loadHotspotsList();

        // Обновляем текущую сцену с новыми точками
        updateSceneWithHotspots();

        // Сохраняем точки в JSON файл
        saveHotspotsToJson(hotspot.panorama_url);

        alert('Точка сохранена и JSON файл обновлен!');
    }


    // Обновляем функцию updateSceneWithHotspots для правильного формата
    function updateSceneWithHotspots() {
        if (!sceneMain) return;

        // Преобразуем точки в формат Pannellum
        var pannellumHotspots = currentHotspots.map(function(hotspot) {
            return {
                pitch: hotspot.pitch,
                yaw: hotspot.yaw,
                type: hotspot.type || "scene",
                text: hotspot.text,
                sceneId: "scene1",
                panorama_url: hotspot.panorama_url,
                point_pitch: hotspot.targetPitch || 0,
                point_yaw: hotspot.targetYaw || 0
            };
        });

        // Обновляем hotspots в текущей сцене
        var scene = sceneMain.getScene();
        sceneMain.removeHotSpot('all');

        pannellumHotspots.forEach(function(hotspot, index) {
            sceneMain.addHotSpot(hotspot, "scene1");
        });
    }

    // Функция сохранения точек в JSON файл
    function saveHotspotsToJson(imageUrl) {
        if (currentHotspots.length === 0) return;

        // Извлекаем имя файла из URL
        var fileName = extractFileNameFromUrl(imageUrl);
        if (!fileName) {
            console.error('Не удалось извлечь имя файла из URL:', imageUrl);
            return;
        }

        // Меняем расширение на .json
        var jsonFileName = fileName.replace(/\.[^/.]+$/, "") + ".json";

        // Создаем JSON структуру (просто массив точек)
        var jsonData = JSON.stringify(currentHotspots, null, 2);

        // Создаем Blob и ссылку для скачивания
        var blob = new Blob([jsonData], { type: 'application/json' });
        var url = URL.createObjectURL(blob);

        // Создаем временную ссылку для скачивания
        var a = document.createElement('a');
        a.href = url;
        a.download = jsonFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        // Очищаем URL через 1 секунду
        setTimeout(function() {
            URL.revokeObjectURL(url);
        }, 1000);

        console.log('JSON файл сохранен как:', jsonFileName);
    }
    // Функция извлечения имени файла из URL
    function extractFileNameFromUrl(url) {
        try {
            // Убираем параметры запроса
            var urlWithoutParams = url.split('?')[0];

            // Извлекаем имя файла из пути
            var parts = urlWithoutParams.split('/');
            var fileName = parts[parts.length - 1];

            // Проверяем, что есть расширение
            if (!fileName || fileName.indexOf('.') === -1) {
                return null;
            }

            return fileName;
        } catch (e) {
            console.error('Ошибка при извлечении имени файла:', e);
            return null;
        }
    }
    // Функция загрузки списка точек
    function loadHotspotsList() {
        var container = document.getElementById('hotspotsContainer');
        container.innerHTML = '';

        if (currentHotspots.length === 0) {
            container.innerHTML = '<p>Нет созданных точек</p>';
            return;
        }

        currentHotspots.forEach(function(hotspot, index) {
            var item = document.createElement('div');
            item.className = 'hotspot-item';
            item.innerHTML = `
            <div>
                <strong>${hotspot.name}</strong><br>
                <small>Координаты: Yaw ${hotspot.yaw.toFixed(2)}, Pitch ${hotspot.pitch.toFixed(2)}</small><br>
                <small>URL: ${hotspot.panorama_url.substring(0, 50)}...</small>
            </div>
            <div class="hotspot-actions">
                <button onclick="editHotspot(${index})" class="btn">✏️</button>
                <button onclick="deleteHotspot(${index})" class="btn">🗑️</button>
            </div>
        `;
            container.appendChild(item);
        });
    }

    // Функция редактирования точки
    function editHotspot(index) {
        var hotspot = currentHotspots[index];

        // Заполняем поля формы
        document.getElementById('hotspotName').value = hotspot.name;
        document.getElementById('hotspotUrl').value = hotspot.panorama_url;
        document.getElementById('hotspotText').value = hotspot.text;

        // Устанавливаем текущие координаты
        currentCoords = {
            pitch: hotspot.pitch,
            yaw: hotspot.yaw
        };

        // Удаляем точку из массива для пересоздания
        currentHotspots.splice(index, 1);

        // Обновляем список
        loadHotspotsList();
    }

    // Функция удаления точки
    function deleteHotspot(index) {
        if (confirm('Удалить эту точку?')) {
            currentHotspots.splice(index, 1);
            loadHotspotsList();
            updateSceneWithHotspots();
        }
    }


    // Обновляем функцию экспорта в JSON
    function exportToJson() {
        if (currentHotspots.length === 0) {
            alert('Нет точек для экспорта');
            return;
        }

        // Получаем имя файла из текущей сцены
        var imageUrl = '';

        // Пытаемся получить URL текущей панорамы
        if (currentScene && currentScene !== 'default') {
            imageUrl = currentScene;
        } else if (currentHotspots.length > 0) {
            // Берем URL из первой точки
            imageUrl = currentHotspots[0].panorama_url;
        }

        if (!imageUrl) {
            // Если не нашли URL, используем дефолтное имя
            var jsonString = JSON.stringify(currentHotspots, null, 2);
            downloadJsonFile(jsonString, 'hotspots_export.json');
            return;
        }

        // Сохраняем с правильным именем
        saveHotspotsToJson(imageUrl);
    }
    // Вспомогательная функция для скачивания JSON файла
    function downloadJsonFile(jsonData, fileName) {
        var blob = new Blob([jsonData], { type: 'application/json' });
        var url = URL.createObjectURL(blob);

        var a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        setTimeout(function() {
            URL.revokeObjectURL(url);
        }, 1000);
    }

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Panorama Edit</title>
    <link rel="stylesheet" href="lib/app/edit.css"/>
    <link rel="stylesheet" href="lib/Pannellum2_5_6/pannellum.css"/>
    <script type="text/javascript" src="lib/Pannellum2_5_6/pannellum.js"></script>
    <script type="text/javascript" src="lib/Pannellum2_5_6/libpannellum.js"></script>
</head>
<body>
<div id="canvas"></div>

<!-- Модальное окно для настройки HotSpot -->
<div id="hotspotModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Настройка HotSpot</h2>

        <div class="form-row">
            <div class="form-group form-group-30">
                <label for="hotspotName">Название точки:</label>
                <input type="text" id="hotspotName" placeholder="Введите название (необязательно)">
            </div>
            <div class="form-group form-group-30">
                <label for="hotspotType">Тип точки:</label>
                <select id="hotspotType">
                    <option value="scene">Переход на сцену</option>
                    <option value="info">Информационная</option>
                    <option value="custom">Пользовательская</option>
                </select>
            </div>
            <div class="form-group form-group-30">
                <label for="hotspotText">Текст на точке:</label>
                <input type="text" id="hotspotText" placeholder="Текст, который будет отображаться">
            </div>
        </div>

        <div class="form-group">
            <label for="hotspotUrl">URL панорамы для перехода:</label>
            <div class="url-input-group">
                <input type="text" id="hotspotUrl" placeholder="Введите URL панорамы">
                <button id="previewClsUrl" class="btn">cls</button>
                <button id="previewButton" class="btn btn-success">Предпросмотр</button>
            </div>
        </div>

        <div id="previewIframeContainer" class="iframe-container">
            <!-- IFRAME с viewer_preview.html будет загружен здесь -->
        </div>

        <div class="modal-actions">
            <button id="saveHotspotButton" class="btn btn-primary">Сохранить точку</button>
            <button id="exportJsonButton" class="btn btn-secondary">Экспорт в JSON</button>
            <button id="importJsonButton" class="btn btn-warning">Импорт JSON</button>
            <button id="cancelButton" class="btn">Отмена</button>
        </div>

        <div id="previewContainer" class="preview-container" style="display: none;">
            <h3>Предпросмотр панорамы</h3>
            <p><strong>Инструкция:</strong> Переместите камеру в нужное направление и сделайте <strong>двойной клик</strong> для выбора точки</p>
        </div>

        <div id="importSuccess" class="import-success"></div>

        <div id="currentHotspotsList" class="hotspots-list">
            <h3>Текущие точки:</h3>
            <div id="hotspotsContainer"></div>
        </div>
    </div>
</div>

<!-- Скрытый input для импорта файлов -->
<input type="file" id="jsonFileInput" class="file-input-hidden" accept=".json">
<script type="text/javascript" src="lib/Pannellum2_5_6/panorama_edit.js"></script>
</body>
</html>

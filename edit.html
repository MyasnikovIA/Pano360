<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Panorama Edit</title>
    <!-- Pannellum CSS -->
    <link rel="stylesheet" href="lib/Pannellum2_5_6/pannellum.css"/>
    <!-- Pannellum JS -->
    <script type="text/javascript" src="lib/Pannellum2_5_6/pannellum.js"></script>
    <script type="text/javascript" src="lib/Pannellum2_5_6/libpannellum.js"></script>
    <style>
        /* Добавляем стили для полноэкранного отображения */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Стили для модального окна */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .url-input-group {
            display: flex;
            gap: 10px;
        }

        .url-input-group input {
            flex: 1;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-secondary {
            background-color: #2196F3;
            color: white;
        }

        .btn-success {
            background-color: #4CAF50;
            color: white;
        }

        .btn-warning {
            background-color: #ff9800;
            color: white;
        }

        .preview-container {
            margin: 20px 0;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 4px;
        }

        .iframe-container {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            margin: 10px 0;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .preview-coordinates {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .preview-coordinates p {
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        #selectedCoordinates {
            min-height: 60px;
            padding: 8px;
            background-color: white;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .hotspots-list {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .hotspot-item {
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f9f9f9;
        }

        .hotspot-item:hover {
            background-color: #f0f0f0;
        }

        .hotspot-actions {
            display: flex;
            gap: 5px;
        }

        .file-input-hidden {
            display: none;
        }

        .import-success {
            background-color: #d4edda;
            color: #155724;
            padding: 8px;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
        }
    </style>
</head>
<body>
<div id="canvas"></div>

<!-- Модальное окно для настройки HotSpot -->
<div id="hotspotModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Настройка HotSpot</h2>

        <div class="form-group">
            <label for="hotspotName">Название точки:</label>
            <input type="text" id="hotspotName" placeholder="Введите название (необязательно)">
        </div>

        <div class="form-group">
            <label for="hotspotUrl">URL панорамы для перехода:</label>
            <div class="url-input-group">
                <input type="text" id="hotspotUrl" placeholder="Введите URL панорамы">
                <button id="previewClsUrl" class="btn">cls</button>
                <button id="previewButton" class="btn btn-success">Предпросмотр</button>
            </div>
        </div>

        <div id="previewContainer" class="preview-container" style="display: none;">
            <h3>Предпросмотр панорамы</h3>
            <p><strong>Инструкция:</strong> Переместите камеру в нужное направление и сделайте <strong>двойной клик</strong> для выбора точки</p>
            <div id="previewIframeContainer" class="iframe-container">
                <!-- IFRAME с viewer_preview.html будет загружен здесь -->
            </div>
            <div class="preview-coordinates">
                <p>Выбранные координаты:</p>
                <div id="selectedCoordinates">Не выбрано</div>
            </div>
        </div>

        <div class="form-group">
            <label for="hotspotType">Тип точки:</label>
            <select id="hotspotType">
                <option value="scene">Переход на сцену</option>
                <option value="info">Информационная</option>
                <option value="custom">Пользовательская</option>
            </select>
        </div>

        <div class="form-group">
            <label for="hotspotText">Текст на точке:</label>
            <input type="text" id="hotspotText" placeholder="Текст, который будет отображаться">
        </div>

        <div class="modal-actions">
            <button id="saveHotspotButton" class="btn btn-primary">Сохранить точку</button>
            <button id="exportJsonButton" class="btn btn-secondary">Экспорт в JSON</button>
            <button id="importJsonButton" class="btn btn-warning">Импорт JSON</button>
            <button id="cancelButton" class="btn">Отмена</button>
        </div>

        <div id="importSuccess" class="import-success"></div>

        <div id="currentHotspotsList" class="hotspots-list">
            <h3>Текущие точки:</h3>
            <div id="hotspotsContainer"></div>
        </div>
    </div>
</div>

<!-- Скрытый input для импорта файлов -->
<input type="file" id="jsonFileInput" class="file-input-hidden" accept=".json">

<script>
    var sceneMain = null;
    var currentScene = null;
    var currentHotspots = [];
    var currentCoords = null;
    var selectedPreviewCoords = null;
    var previewIframe = null;
    var messageHandlerBound = false;
    var isInIframe = window.self !== window.top;

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', function() {
        // Предотвращаем стандартное контекстное меню на всей странице если не в iframe
        if (!isInIframe) {
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
        }
        loadInitialScene();
        initModalHandlers();
    });

    function loadInitialScene() {
        setSelectPanorama();
    }

    function setSelectPanorama(hotSpot) {
        let params = new URLSearchParams(document.location.search);
        let infoValue = params.get('info');
        let photoValue = params.get('photo');
        if (photoValue && photoValue.indexOf('\\') != -1) {
            photoValue = photoValue.replaceAll('\\','/');
        }
        let hotSpots = params.get('hotSpots');
        if (hotSpots && hotSpots.indexOf('\\') != -1) {
            hotSpots = hotSpots.replaceAll('\\','/');
        }
        let canvas = document.getElementById('canvas');
        canvas.style.width = '100%';
        canvas.style.height = '100%';

        // Инициализируем базовый jsonObj
        let jsonObj = {
            "hotSpotDebug": false,
            "hotPointDebug": !isInIframe,
            "sceneFadeDuration": isInIframe ? 500 : 1000,
            "default": {
                "firstScene": "scene1"
            },
            "scenes": {
                "scene1": {
                    "title": "",
                    "crossOrigin": "use-credentials",
                    "autoLoad": true,
                    "yaw": 0,
                    "pitch": 0,
                    "hotSpots": []
                }
            }
        };
        jsonObj.onClickHotSpot = onClickHotSpot;
        jsonObj.onDblClick = isInIframe ? null : onDblClick;
        jsonObj.onClick = onClick;
        if (!isInIframe) {
            jsonObj.onContextMenuHotSpot = onContextMenuHotSpot;
            jsonObj.onContextMenu = onContextMenu;
        }
        // Функция для завершения настройки и отображения сцены
        const finalizeScene = async (imageUrl, isExternal, hotspotsData, cameraDirection) => {
            // Обновляем поля сцены
            jsonObj.scenes.scene1.panorama = imageUrl;
            jsonObj.scenes.scene1.crossOrigin = isExternal ? undefined : "use-credentials";

            // Устанавливаем направление камеры из hotSpot или из JSON
            if (hotSpot && hotSpot.point_pitch !== undefined) {
                jsonObj.scenes.scene1.pitch = hotSpot.point_pitch;
            } else if (cameraDirection && cameraDirection.pitchCam !== undefined) {
                jsonObj.scenes.scene1.pitch = cameraDirection.pitchCam;
            }

            if (hotSpot && hotSpot.point_yaw !== undefined) {
                jsonObj.scenes.scene1.yaw = hotSpot.point_yaw;
            } else if (cameraDirection && cameraDirection.yawCam !== undefined) {
                jsonObj.scenes.scene1.yaw = cameraDirection.yawCam;
            }

            // Если есть hotspots в URL параметре, парсим их
            var hotspotsArray = [];
            if (hotSpots) {
                try {
                    hotspotsArray = JSON.parse(decodeURIComponent(hotSpots));
                } catch (e) {
                    console.error("Error parsing hotSpots URL parameter:", e);
                }
            }

            // Объединяем hotspots из JSON и URL параметра
            var allHotSpots = [];
            if (Array.isArray(hotspotsData)) {
                allHotSpots = allHotSpots.concat(hotspotsData);
            }
            if (Array.isArray(hotspotsArray)) {
                allHotSpots = allHotSpots.concat(hotspotsArray);
            }

            // Убираем дубликаты по pitch/yaw
            var uniqueHotspots = [];
            var seen = {};
            allHotSpots.forEach(function(item) {
                var key = item.pitch + '|' + item.yaw + '|' + (item.panorama_url || '');
                if (!seen[key]) {
                    seen[key] = true;
                    uniqueHotspots.push(item);
                }
            });

            // Преобразуем hotspots в формат Pannellum
            jsonObj.scenes.scene1.hotSpots = uniqueHotspots.map(function(hotspot) {
                return {
                    pitch: hotspot.pitch,
                    yaw: hotspot.yaw,
                    type: hotspot.type || "scene",
                    text: hotspot.text || "Переход",
                    sceneId: "scene1",
                    panorama_url: hotspot.panorama_url,
                    point_pitch: hotspot.targetPitch || 0,
                    point_yaw: hotspot.targetYaw || 0
                };
            });

            // Сохраняем текущие hotspots для редактора
            currentHotspots = uniqueHotspots;

            // Уничтожаем предыдущую сцену если она существует
            if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                sceneMain.destroy();
            }

            // Создаем новую сцену
            sceneMain = pannellum.viewer('canvas', jsonObj);
            currentScene = imageUrl;

            // Если есть направление камеры из JSON, устанавливаем его с задержкой
            if (cameraDirection && (cameraDirection.pitchCam !== undefined || cameraDirection.yawCam !== undefined)) {
                setTimeout(function() {
                    if (sceneMain) {
                        var targetPitch = cameraDirection.pitchCam || jsonObj.scenes.scene1.pitch;
                        var targetYaw = cameraDirection.yawCam || jsonObj.scenes.scene1.yaw;
                        sceneMain.lookAt(targetPitch, targetYaw, sceneMain.getHfov(), 1000);
                        console.log("Camera direction set from JSON: Pitch=" + targetPitch + ", Yaw=" + targetYaw);
                    }
                }, 1000);
            }

            // Обновляем список hotspots в интерфейсе
            setTimeout(function() {
                loadHotspotsList();
            }, 500);
        };

        // Основная логика загрузки
        if (photoValue) {
            var imageUrl = photoValue;
            var isExternal = /^https?:\/\//i.test(photoValue);
            // Для изображений пробуем загрузить JSON с горячими точками
            var jsonUrl = photoValue.replace(/\.[^/.]+$/, "") + ".json";
            var cameraDirection = {};

            // Пробуем загрузить JSON
            loadHotSpotsFromJson(jsonUrl)
                .then(function(jsonData) {
                    // Получаем hotspots и направление камеры из JSON
                    var hotspotsFromJson = jsonData.hotSpots || [];
                    if (jsonData.pitchCam !== undefined && jsonData.yawCam !== undefined) {
                        cameraDirection = {
                            pitchCam: jsonData.pitchCam,
                            yawCam: jsonData.yawCam
                        };
                        console.log("Loaded camera direction from JSON:", cameraDirection);
                    }
                    console.log("Loaded hotspots from JSON:", hotspotsFromJson.length);
                    // Загружаем сцену с данными из JSON
                    return finalizeScene(imageUrl, isExternal, hotspotsFromJson, cameraDirection);
                })
                .catch(function(error) {
                    console.log("No JSON file found or error loading:", jsonUrl, error);
                    // Загружаем сцену без данных из JSON
                    return finalizeScene(imageUrl, isExternal, [], {});
                });
        }
        else if (infoValue) {
            // Для старых JSON конфигураций
            let oldJsonObj = getJsonUrlData('/Example/pano360/point_info/' + infoValue);

            // Объединяем с базовым jsonObj
            Object.assign(jsonObj, oldJsonObj);

            // Добавляем обработчики событий
            jsonObj.onClickHotSpot = onClickHotSpot;
            jsonObj.onDblClick = isInIframe ? null : onDblClick;
            jsonObj.onClick = onClick;

            if (!isInIframe) {
                jsonObj.onContextMenuHotSpot = onContextMenuHotSpot;
                jsonObj.onContextMenu = onContextMenu;
            }

            if (hotSpot) {
                if (hotSpot.point_pitch !== undefined && jsonObj.scenes && jsonObj.scenes.scene1) {
                    jsonObj.scenes.scene1.pitch = hotSpot.point_pitch;
                }
                if (hotSpot.point_yaw !== undefined && jsonObj.scenes && jsonObj.scenes.scene1) {
                    jsonObj.scenes.scene1.yaw = hotSpot.point_yaw;
                }
            }

            if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                sceneMain.destroy();
            }
            sceneMain = pannellum.viewer('canvas', jsonObj);
            currentScene = infoValue;
        }
        else {
            // Загрузка изображения по умолчанию
            var defaultImage = 'img/04.01.2026/DSCN0021.JPG';

            jsonObj.scenes.scene1.title = "Default Panorama";
            jsonObj.scenes.scene1.panorama = defaultImage;
            jsonObj.scenes.scene1.yaw = -6.77;
            jsonObj.scenes.scene1.pitch = -24.41;

            // Пробуем загрузить hotspots из JSON для изображения по умолчанию
            var jsonUrl = defaultImage.replace(/\.[^/.]+$/, "") + ".json";
            var cameraDirection = {};

            loadHotSpotsFromJson(jsonUrl)
                .then(function(jsonData) {
                    // Получаем hotspots и направление камеры из JSON
                    var hotspotsFromJson = jsonData.hotSpots || [];
                    if (jsonData.pitchCam !== undefined && jsonData.yawCam !== undefined) {
                        cameraDirection = {
                            pitchCam: jsonData.pitchCam,
                            yawCam: jsonData.yawCam
                        };
                        // Переопределяем направление камеры из JSON
                        jsonObj.scenes.scene1.pitch = cameraDirection.pitchCam;
                        jsonObj.scenes.scene1.yaw = cameraDirection.yawCam;
                        console.log("Loaded camera direction from JSON for default image:", cameraDirection);
                    }
                    console.log("Loaded hotspots from JSON for default image:", hotspotsFromJson.length);

                    // Преобразуем hotspots в формат Pannellum
                    jsonObj.scenes.scene1.hotSpots = hotspotsFromJson.map(function(hotspot) {
                        return {
                            pitch: hotspot.pitch,
                            yaw: hotspot.yaw,
                            type: hotspot.type || "scene",
                            text: hotspot.text || "Переход",
                            sceneId: "scene1",
                            panorama_url: hotspot.panorama_url,
                            point_pitch: hotspot.targetPitch || 0,
                            point_yaw: hotspot.targetYaw || 0
                        };
                    });

                    // Сохраняем текущие hotspots для редактора
                    currentHotspots = hotspotsFromJson;

                    if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                        sceneMain.destroy();
                    }
                    sceneMain = pannellum.viewer('canvas', jsonObj);
                    currentScene = 'default';

                    // Обновляем список hotspots в интерфейсе
                    setTimeout(function() {
                        loadHotspotsList();
                    }, 500);
                })
                .catch(function(error) {
                    console.log("No JSON file found for default image:", jsonUrl, error);

                    // Загружаем сцену без hotspots из JSON
                    if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                        sceneMain.destroy();
                    }
                    sceneMain = pannellum.viewer('canvas', jsonObj);
                    currentScene = 'default';

                    // Обновляем список hotspots (пустой)
                    setTimeout(function() {
                        currentHotspots = [];
                        loadHotspotsList();
                    }, 500);
                });
        }
    }

    // Функция для загрузки hotspots из JSON файла
    async function loadHotSpotsFromJson(jsonUrl) {
        try {
            const response = await fetch(jsonUrl, {
                method: 'GET',
                mode: 'cors',
                headers: {
                    'Accept': 'application/json'
                },
                cache: 'force-cache'
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            console.log("Loaded JSON data from:", jsonUrl);

            // Проверяем новый формат
            if (data && data.hotSpots && Array.isArray(data.hotSpots)) {
                return data; // Возвращаем весь объект JSON
            }
            // Проверяем старый формат для обратной совместимости
            else if (Array.isArray(data)) {
                return { hotSpots: data, pitchCam: 0, yawCam: 0 };
            } else if (data.hotspots && Array.isArray(data.hotspots)) {
                return { hotSpots: data.hotspots, pitchCam: 0, yawCam: 0 };
            } else if (data.scenes && data.scenes.scene1 && data.scenes.scene1.hotSpots) {
                return { hotSpots: data.scenes.scene1.hotSpots, pitchCam: 0, yawCam: 0 };
            }
            console.log("No valid hotspots found in JSON, returning empty object");
            return { hotSpots: [], pitchCam: 0, yawCam: 0 };
        } catch (error) {
            console.log("Error loading JSON hotspots from:", jsonUrl, error);
            throw error;
        }
    }
    function onDblClick(coords, screenCoords, event) {
        if (isInIframe) return; // Не обрабатываем двойной клик в iframe

        console.log("Double click on scene:", {
            coords: coords,
            screenCoords: screenCoords,
            event: event
        });

        if (coords) {
            openHotSpotModal(coords);
        }
    }

    function onClick(hs) {
        console.log("onClick", arguments[0]);
    }

    function onClickHotSpot(hs) {
        console.log("onClickHotSpot", hs);
        if (sceneMain) {
            copyToClipboardLegacy(sceneMain.getConfig().panorama,null);
        }
        // Проверяем, есть ли URL для загрузки новой сцены
        if (hs.panorama_url) {
            // Обновляем URL страницы с новыми параметрами
            let currentUrl = new URL(window.location.href);
            currentUrl.searchParams.set('photo', hs.panorama_url);
            currentUrl.searchParams.delete('hotSpots');

            // Если в iframe, используем postMessage для уведомления родителя
            if (isInIframe) {
                try {
                    window.parent.postMessage({
                        type: 'pannellum_navigation',
                        url: currentUrl.toString(),
                        hotSpot: hs
                    }, '*');
                } catch(e) {
                    console.log('Cannot post message to parent');
                }
            }

            window.history.pushState({}, '', currentUrl);

            // Загружаем новую сцену
            setSelectPanorama(hs);
            return true;
        }

        // Старая логика для JSON конфигураций
        const jsonName = hs['panorama_url']?.split('/')[4];
        if (jsonName) {
            const name = jsonName.split('.')[0];
            let currentUrl = new URL(window.location.href);
            if (!currentUrl.searchParams.get('info')) {
                currentUrl.searchParams.append('info', hs.panorama_url.split('/')[4]);
            } else {
                currentUrl.searchParams.set('info', hs.panorama_url.split('/')[4]);
            }
            currentUrl.searchParams.delete('hotSpots');
            // Если в iframe, уведомляем родителя
            if (isInIframe) {
                try {
                    window.parent.postMessage({
                        type: 'pannellum_navigation',
                        url: currentUrl.toString(),
                        hotSpot: hs
                    }, '*');
                } catch(e) {
                    console.log('Cannot post message to parent');
                }
            }
            window.history.pushState({}, '', currentUrl);
            let jsonObj = getJsonUrlData(hs['panorama_url']);
            jsonObj.onClickHotSpot = onClickHotSpot;
            jsonObj.onDblClick = isInIframe ? null : onDblClick; // Отключаем двойной клик в iframe
            jsonObj.onClick = onClick;

            if (!isInIframe) {
                jsonObj.onContextMenuHotSpot = onContextMenuHotSpot;
                jsonObj.onContextMenu = onContextMenu;
            }

            jsonObj['pitch'] = hs['point_pitch'];
            jsonObj['yaw'] = hs['point_yaw'];
            if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                sceneMain.destroy();
            }
            sceneMain = pannellum.viewer('canvas', jsonObj);
            currentScene = name;
            return true;
        }
        return false;
    }

    function getJsonUrlData(url, data) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', url, false);
        xhr.send(data);
        if (xhr.status != 200) {
            console.error(xhr.status + ': ' + xhr.statusText + ' (' + url + ')');
            return {'error': xhr.status + ' : ' + xhr.statusText};
        } else {
            return JSON.parse(xhr.response);
        }
    }

    function onContextMenuHotSpot(coords, screenCoords, event, hotSpot) {
        if (isInIframe) return; // Не обрабатываем контекстное меню в iframe

        console.log("Right click on HotSpot:", {
            coords: coords,
            screenCoords: screenCoords,
            hotSpot: hotSpot,
            event: event
        });

        alert(`HotSpot context menu:\n` +
            `Yaw: ${coords.yaw.toFixed(2)}°\n` +
            `Pitch: ${coords.pitch.toFixed(2)}°\n` +
            `Screen: (${screenCoords.x}, ${screenCoords.y})\n` +
            `HotSpot text: ${hotSpot.text || 'No text'}`);

        showCustomContextMenu(screenCoords.x, screenCoords.y, {
            type: 'hotspot',
            data: hotSpot,
            coords: coords
        });
    }

    function onContextMenu(coords, screenCoords, event) {
        if (isInIframe) return; // Не обрабатываем контекстное меню в iframe

        console.log("Right click on scene:", {
            coords: coords,
            screenCoords: screenCoords,

    function saveHotspotsToJson(imageUrl) {
        if (currentHotspots.length === 0) return;

        var fileName = extractFileNameFromUrl(imageUrl);
        if (!fileName) {
            console.error('Не удалось извлечь имя файла из URL:', imageUrl);
            return;
        }

        var jsonFileName = fileName.replace(/\.[^/.]+$/, "") + ".json";

        // Преобразуем hotspots в формат, совместимый с Pannellum
        var pannellumHotspots = currentHotspots.map(function(hotspot) {
            return {
                pitch: hotspot.pitch,
                yaw: hotspot.yaw,
                type: hotspot.type || "scene",
                text: hotspot.text || "Переход",
                sceneId: "scene1",
                panorama_url: hotspot.panorama_url,
                point_pitch: hotspot.targetPitch || 0,
                point_yaw: hotspot.targetYaw || 0
            };
        });

        var jsonData = JSON.stringify(pannellumHotspots, null, 2);
        var blob = new Blob([jsonData], { type: 'application/json' });
        var url = URL.createObjectURL(blob);

        var a = document.createElement('a');
        a.href = url;
        a.download = jsonFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        setTimeout(function() {
            URL.revokeObjectURL(url);
        }, 1000);

        console.log('JSON файл сохранен как:', jsonFileName);
        alert('Hotspots сохранены в файл: ' + jsonFileName);
    }

    function extractFileNameFromUrl(url) {
        try {
            var urlWithoutParams = url.split('?')[0];
            var parts = urlWithoutParams.split('/');
            var fileName = parts[parts.length - 1];

            if (!fileName || fileName.indexOf('.') === -1) {
                return null;
            }

            return fileName;
        } catch (e) {
            console.error('Ошибка при извлечении имени файла:', e);
            return null;
        }
    }

    function getExportFileName() {
        var panoramaUrl = '';

        // Получаем URL текущей панорамы из конфигурации sceneMain
        if (sceneMain && typeof sceneMain.getConfig === 'function') {
            try {
                var config = sceneMain.getConfig();
                if (config && config.scenes && config.scenes.scene1 && config.scenes.scene1.panorama) {
                    panoramaUrl = config.scenes.scene1.panorama;
                } else if (config && config.panorama) {
                    panoramaUrl = config.panorama;
                }
            } catch (e) {
                console.error('Ошибка при получении конфигурации:', e);
            }
        }
        let fileName = '';
        if (panoramaUrl) {
            // Получаем последнюю часть URL (имя файла)
            let urlParts = panoramaUrl.split('/');
            fileName = urlParts[urlParts.length - 1];
            fileName = fileName.split('?')[0];
        }
        if (!fileName) {
            return 'hotspots_export.json';
        }
        let baseName = fileName.replace(/\.[^/.]+$/, "");
        return baseName + ".json";
    }

    function exportToJson() {
        if (isInIframe) return; // Не экспортируем в iframe
        if (currentHotspots.length === 0) {
            alert('Нет точек для экспорта');
            return;
        }

        // Получаем URL текущей сцены
        var cameraPitch = 0;
        var cameraYaw = 0;
        if (sceneMain && typeof sceneMain.getPitch === 'function' && typeof sceneMain.getYaw === 'function') {
            try {
                cameraPitch = sceneMain.getPitch();
                cameraYaw = sceneMain.getYaw();
                console.log("Current camera direction: Pitch=" + cameraPitch + ", Yaw=" + cameraYaw);
            } catch (e) {
                console.error('Ошибка при получении направления камеры:', e);
            }
        }
        var jsonData = {
            pitchCam: parseFloat(cameraPitch.toFixed(12)),
            yawCam: parseFloat(cameraYaw.toFixed(12)),
            hotSpots: currentHotspots.map(function(hotspot) {
                return {
                    id: hotspot.id || Date.now(),
                    name: hotspot.name || 'Без имени',
                    type: hotspot.type || "scene",
                    text: hotspot.text || "Переход",
                    pitch: parseFloat(hotspot.pitch.toFixed(12)),
                    yaw: parseFloat(hotspot.yaw.toFixed(12)),
                    targetPitch: parseFloat((hotspot.targetPitch || 0).toFixed(12)),
                    targetYaw: parseFloat((hotspot.targetYaw || 0).toFixed(12)),
                    panorama_url: hotspot.panorama_url,
                    createdAt: hotspot.createdAt || new Date().toISOString()
                };
            })
        };

        var jsonString = JSON.stringify(jsonData, null, 2);
        downloadJsonFile(jsonString, getExportFileName());
    }
    function importJson() {
        if (isInIframe) return; // Не импортируем в iframe
        document.getElementById('jsonFileInput').click();
    }

    function handleJsonFileSelect(event) {
        if (isInIframe) return; // Не обрабатываем импорт в iframe

        var file = event.target.files[0];
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var importedData = JSON.parse(e.target.result);
                var hotspotsArray = [];
                var cameraPitch = 0;
                var cameraYaw = 0;

                console.log("Importing JSON data:", importedData);

                // Проверяем правильный формат (как DSCN0021.JSON)
                if (importedData && importedData.hotSpots && Array.isArray(importedData.hotSpots)) {
                    hotspotsArray = importedData.hotSpots;
                    if (importedData.pitchCam !== undefined) {
                        cameraPitch = importedData.pitchCam;
                    }
                    if (importedData.yawCam !== undefined) {
                        cameraYaw = importedData.yawCam;
                    }
                }
                // Проверяем старый формат для обратной совместимости
                else if (Array.isArray(importedData)) {
                    hotspotsArray = importedData;
                } else if (importedData.hotspots && Array.isArray(importedData.hotspots)) {
                    hotspotsArray = importedData.hotspots;
                } else {
                    throw new Error('Некорректный формат JSON файла. Ожидается объект с полем hotSpots');
                }

                // Проверяем структуру точек
                if (hotspotsArray.length > 0) {
                    var firstHotspot = hotspotsArray[0];
                    if (firstHotspot.pitch === undefined || firstHotspot.yaw === undefined || !firstHotspot.panorama_url) {
                        throw new Error('Некорректная структура точек в JSON файле');
                    }
                }

                // Объединяем с существующими точками (исключая дубликаты по ID)
                var existingIds = currentHotspots.map(h => h.id);
                var newHotspots = hotspotsArray.filter(h => !existingIds.includes(h.id));

                // Обрабатываем точки без ID
                newHotspots.forEach(function(hotspot) {
                    if (!hotspot.id) {
                        hotspot.id = Date.now() + Math.floor(Math.random() * 1000);
                    }
                    if (!hotspot.createdAt) {
                        hotspot.createdAt = new Date().toISOString();
                    }
                });

                currentHotspots = currentHotspots.concat(newHotspots);
                loadHotspotsList();
                updateSceneWithHotspots();

                // Устанавливаем направление камеры если оно было в JSON
                if (cameraPitch !== 0 || cameraYaw !== 0) {
                    if (sceneMain) {
                        sceneMain.lookAt(cameraPitch, cameraYaw, sceneMain.getHfov(), 1000);
                    }
                }

                // Показываем сообщение об успехе
                var successDiv = document.getElementById('importSuccess');
                successDiv.innerHTML = `
                <strong>✓ Импорт успешно завершен!</strong><br>
                Загружено ${newHotspots.length} новых точек (всего: ${currentHotspots.length})
                ${cameraPitch !== 0 || cameraYaw !== 0 ?
                    '<br>Направление камеры: Pitch=' + cameraPitch.toFixed(2) + '°, Yaw=' + cameraYaw.toFixed(2) + '°' :
                    ''}
            `;
                successDiv.style.display = 'block';

                // Автоматически скрываем сообщение через 5 секунд
                setTimeout(function() {
                    successDiv.style.display = 'none';
                }, 5000);

                console.log('Импортировано точек:', newHotspots.length, 'Camera:', cameraPitch, cameraYaw);

            } catch (error) {
                alert('Ошибка при чтении JSON файла: ' + error.message);
                console.error('Import error:', error);
            }
        };

        reader.onerror = function() {
            alert('Ошибка при чтении файла');
        };

        reader.readAsText(file);

        // Сбрасываем input для возможности повторного выбора того же файла
        event.target.value = '';
    }

    function downloadJsonFile(jsonData, fileName) {
        var blob = new Blob([jsonData], { type: 'application/json' });
        var url = URL.createObjectURL(blob);

        var a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        setTimeout(function() {
            URL.revokeObjectURL(url);
        }, 1000);
    }

        // Кнопка предпросмотра

        document.getElementById('importJsonButton').addEventListener('click', importJson);

        // Кнопка отмены
        document.getElementById('cancelButton').addEventListener('click', closeModal);

        document.querySelector('.close').addEventListener('click', closeModal);

        // Обработчик выбора файла для импорта
        document.getElementById('jsonFileInput').addEventListener('change', handleJsonFileSelect);

    // Обработчик сообщений от родительской страницы (если edit.html загружен в iframe)
    window.addEventListener('message', function(event) {
        // Проверяем источник сообщения для безопасности
        // if (event.origin !== 'http://expected-origin.com') return;

        if (event.data && event.data.type === 'pannellum_control') {
            switch(event.data.action) {
                case 'loadScene':
                    if (event.data.photo) {
                        let currentUrl = new URL(window.location.href);
                        currentUrl.searchParams.set('photo', event.data.photo);
                        if (event.data.hotSpots) {
                            currentUrl.searchParams.set('hotSpots', encodeURIComponent(JSON.stringify(event.data.hotSpots)));
                        }
                        window.history.pushState({}, '', currentUrl);
                        setSelectPanorama(event.data.hotSpot || null);
                    }
                    break;
                case 'getState':
                    // Отправляем состояние обратно родителю
                    try {
                        window.parent.postMessage({
                            type: 'pannellum_state',
                            currentScene: currentScene,
                            isLoaded: sceneMain ? sceneMain.isLoaded() : false,
                            hotspotsCount: currentHotspots.length
                        }, '*');
                    } catch(e) {
                        console.log('Cannot post message to parent');
                    }
                    break;
            }
        }
    });
    function copyToClipboardLegacy(text, callback) {
        const textArea = document.createElement('textarea');
        textArea.value = text;

        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        textArea.style.top = '-999999px';
        document.body.appendChild(textArea);

        textArea.focus();
        textArea.select();

        try {
            const successful = document.execCommand('copy');
            const msg = successful ? 'успешно' : 'не удалось';
            console.log(`Копирование ${msg}`);

            if (callback) {
                callback(successful ? null : new Error('Копирование не удалось'));
            }
        } catch (err) {
            console.error('Ошибка при копировании:', err);
            if (callback) {
                callback(err);
            }
        } finally {
            document.body.removeChild(textArea);
        }
    }

</script>

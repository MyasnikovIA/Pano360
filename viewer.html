<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panorama Viewer</title>
    <link rel="stylesheet" href="lib/Pannellum2_5_6/pannellum.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 1000;
        }

        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="loading-spinner"></div>
        <div>Загрузка панорамы...</div>
    </div>

    <div id="canvas"></div>

    <script src="lib/Pannellum2_5_6/pannellum.js"></script>
    <script src="lib/Pannellum2_5_6/libpannellum.js"></script>
    <script src="lib/Pannellum2_5_6/panorama_player.js" defer></script>

    <script>
        // Показать индикатор загрузки
        document.addEventListener('DOMContentLoaded', function() {
            // Прячем индикатор загрузки после загрузки
            setTimeout(function() {
                const loading = document.querySelector('.loading');
                if (loading) {
                    loading.style.display = 'none';
                }
            }, 2000);

            // Создаем плеер
            try {
                window.panoramaPlayer = new PanoramaPlayer('canvas');
            } catch (error) {
                console.error("Failed to initialize panorama player:", error);

                // Показываем сообщение об ошибке
                const errorDiv = document.createElement('div');
                errorDiv.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(0,0,0,0.9);
                    color: white;
                    padding: 30px;
                    border-radius: 10px;
                    text-align: center;
                    z-index: 10000;
                    font-family: Arial, sans-serif;
                `;
                errorDiv.innerHTML = `
                    <h3>Ошибка инициализации</h3>
                    <p>Не удалось загрузить панораму.</p>
                    <button onclick="location.reload()" style="
                        background: #007bff;
                        color: white;
                        border: none;
                        padding: 10px 20px;
                        margin-top: 20px;
                        border-radius: 5px;
                        cursor: pointer;
                    ">Попробовать снова</button>
                `;
                document.body.appendChild(errorDiv);
            }
        });
    </script>
</body>
</html>

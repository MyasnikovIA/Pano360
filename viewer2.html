<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Panorama Viewer</title>
    <!-- Pannellum CSS -->
    <link rel="stylesheet" href="lib/Pannellum2_5_6/pannellum.css"/>
    <!-- Pannellum JS -->
    <script type="text/javascript" src="lib/Pannellum2_5_6/pannellum.js"></script>
    <script type="text/javascript" src="lib/Pannellum2_5_6/libpannellum.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Скрываем элемент about у Pannellum */
        .pnlm-about-msg {
            display: none !important;
        }
    </style>
</head>
<body>
<div id="canvas"></div>

<script>
    var sceneMain = null;
    var currentScene = null;

    document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        loadInitialScene();
    });

    function loadInitialScene() {
        setSelectPanorama();
    }

    function setSelectPanorama(hotSpot) {
        var params = new URLSearchParams(document.location.search);
        var infoValue = params.get('info');
        var photoValue = params.get('photo');
        if (photoValue && photoValue.indexOf('\\') != -1) {
            photoValue = photoValue.replaceAll('\\','/');
        }
        var hotSpots = params.get('hotSpots');
        if (hotSpots && hotSpots.indexOf('\\') != -1) {
            hotSpots = hotSpots.replaceAll('\\','/');
        }
        var canvas = document.getElementById('canvas');
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        var jsonObj = {
            "hotSpotDebug": false,
            "hotPointDebug": false,
            "sceneFadeDuration": 1000,
            "default": {
                "firstScene": "scene1"
            },
            "scenes": {
                "scene1": {
                    "title": "",
                    "crossOrigin": "use-credentials",
                    "autoLoad": true,
                    "yaw": 0,
                    "pitch": 0,
                    "hotSpots": []
                }
            }
        };
        jsonObj.onClickHotSpot = onClickHotSpot;

        if (photoValue) {
            var imageUrl = photoValue;
            var isExternal = /^https?:\/\//i.test(photoValue);
            var jsonUrl = photoValue.replace(/\.[^/.]+$/, "") + ".json";

            // Загружаем hotspots из JSON
            loadHotSpotsFromJson(jsonUrl, function(jsonData) {
                var hotspotsFromJson = [];
                var cameraDirection = {};

                if (jsonData) {
                    // Получаем hotspots и направление камеры из JSON
                    hotspotsFromJson = jsonData.hotSpots || [];
                    if (jsonData.pitchCam !== undefined && jsonData.yawCam !== undefined) {
                        cameraDirection = {
                            pitchCam: jsonData.pitchCam,
                            yawCam: jsonData.yawCam
                        };
                        console.log("Loaded camera direction from JSON:", cameraDirection);
                    }
                    console.log("Loaded hotspots from JSON:", hotspotsFromJson.length);
                }

                finalizeScene(imageUrl, isExternal, hotspotsFromJson, cameraDirection, hotSpot);
            });
        }
        else if (infoValue) {
            var oldJsonObj = getJsonUrlData('/Example/pano360/point_info/' + infoValue);
            Object.assign(jsonObj, oldJsonObj);
            if (hotSpot) {
                if (hotSpot.point_pitch !== undefined && jsonObj.scenes && jsonObj.scenes.scene1) {
                    jsonObj.scenes.scene1.pitch = hotSpot.point_pitch;
                }
                if (hotSpot.point_yaw !== undefined && jsonObj.scenes && jsonObj.scenes.scene1) {
                    jsonObj.scenes.scene1.yaw = hotSpot.point_yaw;
                }
            }

            if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                sceneMain.destroy();
            }
            // Добавляем параметр для предотвращения кэширования изображений
            if (jsonObj.scenes && jsonObj.scenes.scene1 && jsonObj.scenes.scene1.panorama) {
                var timestamp = new Date().getTime();
                jsonObj.scenes.scene1.panorama += (jsonObj.scenes.scene1.panorama.includes('?') ? '&' : '?') + '_nocache=' + timestamp;
            }
            sceneMain = pannellum.viewer('canvas', jsonObj);
            currentScene = infoValue;
        }
        else {
            // Загрузка изображения по умолчанию
            var defaultImage = 'img/04.01.2026/DSCN0021.JPG';
            var jsonUrl = defaultImage.replace(/\.[^/.]+$/, "") + ".json";

            loadHotSpotsFromJson(jsonUrl, function(jsonData) {
                var hotspotsFromJson = [];
                var cameraDirection = {};

                if (jsonData) {
                    hotspotsFromJson = jsonData.hotSpots || [];
                    if (jsonData.pitchCam !== undefined && jsonData.yawCam !== undefined) {
                        cameraDirection = {
                            pitchCam: jsonData.pitchCam,
                            yawCam: jsonData.yawCam
                        };
                        console.log("Loaded camera direction from JSON for default image:", cameraDirection);
                    }
                    console.log("Loaded hotspots from JSON for default image:", hotspotsFromJson.length);
                }

                // Преобразуем hotspots в формат Pannellum
                jsonObj.scenes.scene1.hotSpots = hotspotsFromJson.map(function(hotspot) {
                    return {
                        pitch: hotspot.pitch,
                        yaw: hotspot.yaw,
                        type: hotspot.type || "scene",
                        text: hotspot.text || "Переход",
                        sceneId: "scene1",
                        panorama_url: hotspot.panorama_url,
                        point_pitch: hotspot.targetPitch || 0,
                        point_yaw: hotspot.targetYaw || 0,
                        customScale: hotspot.customScale || undefined
                    };
                });

                // Устанавливаем направление камеры из JSON для изображения по умолчанию
                if (cameraDirection.pitchCam !== undefined) {
                    jsonObj.scenes.scene1.pitch = cameraDirection.pitchCam;
                }
                if (cameraDirection.yawCam !== undefined) {
                    jsonObj.scenes.scene1.yaw = cameraDirection.yawCam;
                } else {
                    jsonObj.scenes.scene1.yaw = -6.77;
                    jsonObj.scenes.scene1.pitch = -24.41;
                }

                jsonObj.scenes.scene1.title = "Default Panorama";
                // Добавляем параметр для предотвращения кэширования
                var timestamp = new Date().getTime();
                jsonObj.scenes.scene1.panorama = defaultImage + (defaultImage.includes('?') ? '&' : '?') + '_nocache=' + timestamp;

                if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                    sceneMain.destroy();
                }
                sceneMain = pannellum.viewer('canvas', jsonObj);
                currentScene = 'default';
            });
        }

        function finalizeScene(imageUrl, isExternal, hotspotsData, cameraDirection, hotSpot) {
            // Добавляем параметр для предотвращения кэширования
            var timestamp = new Date().getTime();
            var imageUrlWithCacheBust = imageUrl + (imageUrl.includes('?') ? '&' : '?') + '_nocache=' + timestamp;

            jsonObj.scenes.scene1.panorama = imageUrlWithCacheBust;
            jsonObj.scenes.scene1.crossOrigin = isExternal ? undefined : "use-credentials";
            if (hotSpot && hotSpot.point_pitch !== undefined) {
                jsonObj.scenes.scene1.pitch = hotSpot.point_pitch;
            } else if (cameraDirection && cameraDirection.pitchCam !== undefined) {
                jsonObj.scenes.scene1.pitch = cameraDirection.pitchCam;
            }

            if (hotSpot && hotSpot.point_yaw !== undefined) {
                jsonObj.scenes.scene1.yaw = hotSpot.point_yaw;
            } else if (cameraDirection && cameraDirection.yawCam !== undefined) {
                jsonObj.scenes.scene1.yaw = cameraDirection.yawCam;
            }
            jsonObj.scenes.scene1.hotSpots = hotspotsData.map(function(hotspot) {
                return {
                    pitch: hotspot.pitch,
                    yaw: hotspot.yaw,
                    type: hotspot.type || "scene",
                    text: hotspot.text || "Переход",
                    sceneId: "scene1",
                    panorama_url: hotspot.panorama_url,
                    point_pitch: hotspot.targetPitch || 0,
                    point_yaw: hotspot.targetYaw || 0,
                    customScale: hotspot.customScale || undefined
                };
            });
            if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                sceneMain.destroy();
            }
            sceneMain = pannellum.viewer('canvas', jsonObj);
            currentScene = imageUrl;
            if (cameraDirection && (cameraDirection.pitchCam !== undefined || cameraDirection.yawCam !== undefined)) {
                setTimeout(function() {
                    if (sceneMain) {
                        var targetPitch = cameraDirection.pitchCam || jsonObj.scenes.scene1.pitch;
                        var targetYaw = cameraDirection.yawCam || jsonObj.scenes.scene1.yaw;
                        sceneMain.lookAt(targetPitch, targetYaw, sceneMain.getHfov(), 1000);
                        console.log("Camera direction set from JSON: Pitch=" + targetPitch + ", Yaw=" + targetYaw);
                    }
                }, 1000);
            }
        }
    }

    // Функция для загрузки hotspots из JSON файла с использованием XMLHttpRequest
    function loadHotSpotsFromJson(jsonUrl, callback) {
        try {
            var xhr = new XMLHttpRequest();
            var timestamp = new Date().getTime();
            var jsonUrlWithCacheBust = jsonUrl + (jsonUrl.includes('?') ? '&' : '?') + '_nocache=' + timestamp;

            xhr.open('GET', jsonUrlWithCacheBust, true);
            xhr.setRequestHeader('Accept', 'application/json');
            xhr.setRequestHeader('Cache-Control', 'no-cache, no-store, must-revalidate');
            xhr.setRequestHeader('Pragma', 'no-cache');

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            console.log("Loaded JSON data from:", jsonUrl);

                            var result = {};
                            // Проверяем новый формат
                            if (data && data.hotSpots && Array.isArray(data.hotSpots)) {
                                result = data;
                            }
                            // Проверяем старый формат для обратной совместимости
                            else if (Array.isArray(data)) {
                                result = { hotSpots: data, pitchCam: 0, yawCam: 0 };
                            } else if (data.hotspots && Array.isArray(data.hotspots)) {
                                result = { hotSpots: data.hotspots, pitchCam: 0, yawCam: 0 };
                            } else if (data.scenes && data.scenes.scene1 && data.scenes.scene1.hotSpots) {
                                result = { hotSpots: data.scenes.scene1.hotSpots, pitchCam: 0, yawCam: 0 };
                            } else {
                                console.log("No valid hotspots found in JSON, returning empty object");
                                result = { hotSpots: [], pitchCam: 0, yawCam: 0 };
                            }

                            callback(result);
                        } catch (e) {
                            console.log("Error parsing JSON from:", jsonUrl, e);
                            callback({ hotSpots: [], pitchCam: 0, yawCam: 0 });
                        }
                    } else {
                        console.log("No JSON file found or error loading:", jsonUrl, xhr.status);
                        callback({ hotSpots: [], pitchCam: 0, yawCam: 0 });
                    }
                }
            };

            xhr.send();
        } catch (error) {
            console.log("Error loading JSON hotspots from:", jsonUrl, error);
            callback({ hotSpots: [], pitchCam: 0, yawCam: 0 });
        }
    }

    // Обработчик клика на HotSpot (переход к другой панораме)
    function onClickHotSpot(hs) {
        console.log("Переход к другой сцене:", hs);

        // Проверяем, есть ли URL для загрузки новой сцены
        if (hs.panorama_url) {
            // Обновляем URL страницы с новыми параметрами
            var currentUrl = new URL(window.location.href);
            currentUrl.searchParams.set('photo', hs.panorama_url);

            window.history.pushState({}, '', currentUrl);

            // Загружаем новую сцену
            setSelectPanorama(hs);
            return true;
        }

        // Старая логика для JSON конфигураций
        var jsonName = hs['panorama_url'] ? hs['panorama_url'].split('/')[4] : null;
        if (jsonName) {
            var name = jsonName.split('.')[0];
            var currentUrl = new URL(window.location.href);
            if (!currentUrl.searchParams.get('info')) {
                currentUrl.searchParams.append('info', hs.panorama_url.split('/')[4]);
            } else {
                currentUrl.searchParams.set('info', hs.panorama_url.split('/')[4]);
            }

            window.history.pushState({}, '', currentUrl);
            var jsonObj = getJsonUrlData(hs['panorama_url']);
            jsonObj.onClickHotSpot = onClickHotSpot;

            jsonObj['pitch'] = hs['point_pitch'];
            jsonObj['yaw'] = hs['point_yaw'];
            if (sceneMain && typeof sceneMain['destroy'] !== 'undefined') {
                sceneMain.destroy();
            }
            // Добавляем параметр для предотвращения кэширования изображений
            if (jsonObj.scenes && jsonObj.scenes.scene1 && jsonObj.scenes.scene1.panorama) {
                var timestamp = new Date().getTime();
                jsonObj.scenes.scene1.panorama += (jsonObj.scenes.scene1.panorama.includes('?') ? '&' : '?') + '_nocache=' + timestamp;
            }
            sceneMain = pannellum.viewer('canvas', jsonObj);
            currentScene = name;
            return true;
        }
        return false;
    }

    // Вспомогательная функция для получения JSON данных (для обратной совместимости)
    function getJsonUrlData(url, data) {
        var xhr = new XMLHttpRequest();
        var timestamp = new Date().getTime();
        var urlWithCacheBust = url + (url.includes('?') ? '&' : '?') + '_nocache=' + timestamp;

        xhr.open('POST', urlWithCacheBust, false);
        xhr.setRequestHeader('Cache-Control', 'no-cache, no-store, must-revalidate');
        xhr.setRequestHeader('Pragma', 'no-cache');
        xhr.send(data);
        if (xhr.status != 200) {
            console.error(xhr.status + ': ' + xhr.statusText + ' (' + url + ')');
            return {'error': xhr.status + ' : ' + xhr.statusText};
        } else {
            return JSON.parse(xhr.response);
        }
    }

    // Обработчик навигации по истории браузера
    window.addEventListener('popstate', function() {
        setSelectPanorama();
    });
</script>
</body>
</html>
